<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkSphere | Unified Job Portal</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body data-theme="light">

  <!-- ================= NAVBAR ================= -->
  <header class="navbar">
    <div class="nav-brand">
      <i class="fa-solid fa-briefcase brand-icon"></i>
      <span class="brand-name">Work<span>Sphere</span></span>
    </div>

    <!-- Global Search -->
    <div class="global-search-container">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="globalSearchInput" placeholder="Search jobs, skills, companies..." />
    </div>

    <div class="nav-actions">
      <!-- Role Switcher -->
      <div class="role-selector">
        <label for="roleSwitch"><i class="fa-solid fa-user-gear"></i> Role:</label>
        <select id="roleSwitch">
          <option value="seeker">Job Seeker</option>
          <option value="recruiter">Recruiter</option>
          <option value="admin">Admin Portal</option>
        </select>
      </div>

      <!-- Theme Toggle -->
      <button class="icon-btn" id="themeToggle" title="Toggle Dark/Light Mode">
        <i class="fa-solid fa-moon"></i>
      </button>

      <!-- Notifications -->
      <div class="notification-wrapper">
        <button class="icon-btn" id="notifBtn" title="Notifications">
          <i class="fa-solid fa-bell"></i>
          <span class="badge" id="notifBadge">3</span>
        </button>
        <div class="notification-dropdown" id="notifDropdown">
          <div class="dropdown-header">
            <h4>Notifications</h4>
            <button class="text-btn" id="markAllRead">Mark all read</button>
          </div>
          <ul class="notif-list" id="notifList">
            <!-- Dynamic Notifications -->
          </ul>
        </div>
      </div>

      <!-- User Profile Menu -->
      <div class="user-badge" id="currentUserBadge">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Avatar" id="userAvatar" />
        <span id="currentUserName">Alex Morgan</span>
      </div>
    </div>
  </header>

  <!-- ================= MAIN LAYOUT ================= -->
  <div class="app-layout">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <nav class="sidebar-nav" id="sidebarMenu">
        <!-- Dynamically rendered based on active role -->
      </nav>
      <div class="sidebar-footer">
        <button class="logout-btn" onclick="toast('Logged out successfully', 'info')">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content Workspace -->
    <main class="content-workspace" id="workspace">
      <!-- Sections will be rendered or toggled via JS -->
    </main>

  </div>

  <!-- ================= MODALS ================= -->

  <!-- 1. Apply for Job Modal -->
  <div class="modal" id="applyModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="applyJobTitle">Apply for Position</h3>
        <button class="close-modal" onclick="closeModal('applyModal')">&times;</button>
      </div>
      <form id="applyJobForm" class="modal-body">
        <input type="hidden" id="applyJobId" />
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="applicantName" required value="Alex Morgan" />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="applicantEmail" required value="alex.morgan@example.com" />
        </div>
        <div class="form-group">
          <label>Attach Resume (PDF/DOCX)</label>
          <input type="file" id="applicantResume" accept=".pdf,.doc,.docx" required />
        </div>
        <div class="form-group">
          <label>Cover Letter / Summary</label>
          <textarea id="applicantCover" rows="4" placeholder="Highlight relevant skills & experience..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('applyModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Application</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. Post / Edit Job Modal (Recruiter) -->
  <div class="modal" id="postJobModal">
    <div class="modal-dialog modal-lg">
      <div class="modal-header">
        <h3 id="postJobModalTitle">Post a New Opportunity</h3>
        <button class="close-modal" onclick="closeModal('postJobModal')">&times;</button>
      </div>
      <form id="postJobForm" class="modal-body grid-form">
        <input type="hidden" id="editJobId" />
        <div class="form-group">
          <label>Job Title</label>
          <input type="text" id="jobTitleInput" required placeholder="e.g. Senior Frontend Engineer" />
        </div>
        <div class="form-group">
          <label>Company Name</label>
          <input type="text" id="companyInput" required placeholder="e.g. TechCorp Solutions" />
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="locationInput" required placeholder="e.g. San Francisco, CA / Remote" />
        </div>
        <div class="form-group">
          <label>Work Mode</label>
          <select id="workModeInput">
            <option value="Remote">Remote</option>
            <option value="Hybrid">Hybrid</option>
            <option value="Onsite">Onsite</option>
          </select>
        </div>
        <div class="form-group">
          <label>Job Type</label>
          <select id="jobTypeInput">
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Contract">Contract</option>
            <option value="Internship">Internship</option>
          </select>
        </div>
        <div class="form-group">
          <label>Experience Level</label>
          <select id="experienceInput">
            <option value="Entry Level">Entry Level</option>
            <option value="Mid Level">Mid Level</option>
            <option value="Senior Level">Senior Level</option>
            <option value="Lead / Executive">Lead / Executive</option>
          </select>
        </div>
        <div class="form-group">
          <label>Salary Range (Annual USD)</label>
          <input type="text" id="salaryInput" placeholder="e.g. $120,000 - $145,000" required />
        </div>
        <div class="form-group">
          <label>Required Skills (comma separated)</label>
          <input type="text" id="skillsInput" placeholder="React, TypeScript, CSS, GraphQL" required />
        </div>
        <div class="form-group full-width">
          <label>Job Description</label>
          <textarea id="descriptionInput" rows="4" placeholder="Detail the day-to-day responsibilities, requirements, and benefits..." required></textarea>
        </div>
        <div class="modal-footer full-width">
          <button type="button" class="btn btn-outline" onclick="closeModal('postJobModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveJobBtn">Post Job</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 3. Schedule Interview Modal -->
  <div class="modal" id="scheduleModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Schedule Interview</h3>
        <button class="close-modal" onclick="closeModal('scheduleModal')">&times;</button>
      </div>
      <form id="scheduleForm" class="modal-body">
        <input type="hidden" id="schedAppId" />
        <div class="form-group">
          <label>Candidate</label>
          <input type="text" id="schedCandidateName" readonly />
        </div>
        <div class="form-group">
          <label>Date & Time</label>
          <input type="datetime-local" id="schedDateTime" required />
        </div>
        <div class="form-group">
          <label>Interview Mode</label>
          <select id="schedMode">
            <option value="Online">Online Video Call</option>
            <option value="Offline">On-site In-Person</option>
            <option value="Phone">Phone Screening</option>
          </select>
        </div>
        <div class="form-group">
          <label>Meeting Link / Location</label>
          <input type="text" id="schedLink" placeholder="https://meet.google.com/xyz or Office Room 4A" required />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('scheduleModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Confirm & Send Invitation</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 4. Job Details View Modal -->
  <div class="modal" id="jobDetailModal">
    <div class="modal-dialog modal-lg">
      <div class="modal-header">
        <h3 id="detailJobTitle">Position Title</h3>
        <button class="close-modal" onclick="closeModal('jobDetailModal')">&times;</button>
      </div>
      <div class="modal-body" id="detailContent">
        <!-- Injected dynamically -->
      </div>
      <div class="modal-footer" id="detailFooter">
        <!-- Injected dynamic action buttons -->
      </div>
    </div>
  </div>

  <!-- 5. Report Job/Content Modal -->
  <div class="modal" id="reportModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Report Content / Job</h3>
        <button class="close-modal" onclick="closeModal('reportModal')">&times;</button>
      </div>
      <form id="reportForm" class="modal-body">
        <input type="hidden" id="reportTargetId" />
        <div class="form-group">
          <label>Reason</label>
          <select id="reportReason">
            <option value="Fraud or Scam">Fraud / Fake Recruiter</option>
            <option value="Inappropriate Content">Inappropriate Content</option>
            <option value="Expired or Misleading">Expired / Misleading Info</option>
            <option value="Spam">Spam or Duplicate</option>
          </select>
        </div>
        <div class="form-group">
          <label>Details</label>
          <textarea id="reportDetails" rows="4" placeholder="Explain the issue..." required></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('reportModal')">Cancel</button>
          <button type="submit" class="btn btn-danger">Submit Report</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
